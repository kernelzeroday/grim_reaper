[package]
name = "grim-reaper"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Fail-closed SSH heartbeat dead-man switch"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
